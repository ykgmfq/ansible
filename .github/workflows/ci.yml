---
name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Path filtering happens per job, not per workflow: a skipped job counts as passing for the
  # required `lint` check, whereas a workflow skipped by `paths:` would leave it pending forever.
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      nft: ${{ steps.filter.outputs.nft }}
      butane: ${{ steps.filter.outputs.butane }}
      tooling: ${{ steps.filter.outputs.tooling }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            lint:
              - roles/**
              - playbooks/**
              - .ansible-lint
              - ansible.cfg
              - .devcontainer/requirements.txt
              - &workflow .github/workflows/ci.yml
            nft:
              - '**/*.nft'
              - roles/*/defaults/main.yml
              - .github/scripts/nft-lint.py
              - *workflow
            butane:
              - server.butane
              - *workflow
            tooling:
              - .devcontainer/requirements.txt
  # ubuntu-slim runs unprivileged inside a container, so it can't host container jobs
  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/ykgmfq/ansible:latest
    steps:
      - uses: actions/checkout@v7
      # The image only gets the new pins after merge, so a bump PR must install them to be linted with them
      - name: Install bumped tooling
        if: needs.changes.outputs.tooling == 'true'
        run: uv pip install --python /opt/ansible -r .devcontainer/requirements.txt
      - run: just galaxy
      - run: just lint-ansible
  nft:
    needs: changes
    if: needs.changes.outputs.nft == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ykgmfq/ansible:latest
      # `nft -c` needs CAP_NET_ADMIN, which containers don't get by default
      options: --cap-add=NET_ADMIN
    steps:
      - uses: actions/checkout@v7
      - run: just lint-nft
  butane:
    needs: changes
    if: needs.changes.outputs.butane == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/ykgmfq/ansible:latest
    steps:
      - uses: actions/checkout@v7
      - run: just butane-check
