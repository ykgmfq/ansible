---
- name: Router
  hosts: router
  serial: 1
  remote_user: root
  become: false
  gather_facts: false
  roles:
    - { role: router_login, tags: [secrets] }
    - hostname
    - router_wan
    - router_firewall
    - { role: wireguard, tags: [secrets] }
    - homeserver_passthrough
    - { role: https_dns_proxy, tags: [secrets] }
    - { role: router_ddns, tags: [secrets] }

# Own play so every other role's handlers have flushed first.
# UCI commits are global, so any earlier network reload would otherwise apply the LAN cutover mid-run.
- name: Router LAN
  hosts: router
  serial: 1
  remote_user: root
  become: false
  gather_facts: false
  roles:
    - router_lan
