{% for ds in zfspool_datasets %}
[{{ dataset }}/{{ ds.name }}]
hourly = {{ ds.hourly }}
daily = {{ ds.daily }}
monthly = {{ ds.monthly }}
{% if ds.recursive | default(false) %}
# Recursive cant't go into template!
recursive = true
{% endif %}
use_template = default

{% endfor %}
#############################
# templates below this line #
#############################

[template_default]
frequently = 0
yearly = 0
autoprune = true
autosnap = {{ (not is_backup_sink) | string | lower }}
