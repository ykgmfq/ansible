---
- name: Configure persistent SELinux contexts for the data pool
  become: true
  community.general.sefcontext:
    target: "{{ item }}"
    setype: container_file_t
    state: present
  loop: "{{ zfspool_source_mounts | map('regex_replace', '^', '/mnt/') | map('regex_replace', '$', '(/.*)?') | list }}"
  notify: "pool SELinux contexts changed"
