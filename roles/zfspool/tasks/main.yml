---
- name: Import
  ansible.builtin.import_tasks: files.yml
- name: Pool imported
  block:
    - name: Pool import state
      ansible.builtin.command: "zpool list {{ hostname }}"
      changed_when: false
      check_mode: false
  rescue:
    - name: Pool import
      ansible.builtin.command: "zpool import -f {{ hostname }}"
      changed_when: true
- name: User present
  ansible.builtin.user:
    name: "{{ zfspool_syncoid_user }}"
    home: "{{ zfspool_syncoid_home }}"
    comment: "from Ansible"
    system: true
    shell: "{{ zfspool_syncoid_shell }}"
- name: User home present
  ansible.builtin.file:
    path: "{{ zfspool_syncoid_home }}"
    state: directory
    owner: "{{ zfspool_syncoid_user }}"
    group: "{{ zfspool_syncoid_user }}"
    mode: "u=rwx,go="
- name: Pool allowlist
  community.general.zfs_delegate_admin:
    users: "{{ zfspool_syncoid_user }}"
    name: "{{ hostname }}"
    permissions: "{{ zfspool_permissions_sink if is_backup_sink else zfspool_permissions_source }}"
- name: Scrub timer enabled
  ansible.builtin.systemd_service:
    state: started
    enabled: true
    name: "zfs-scrub-monthly@{{ hostname }}.timer"
- name: Pool status read
  ansible.builtin.command: "zpool status -t --json --json-flat-vdevs {{ hostname }}"
  register: zfspool_status
  changed_when: false
  check_mode: false
- name: Trim timer enabled
  # USB bridges often hide TRIM from the disks; zpool trim would fail there.
  when: >-
    (zfspool_status.stdout | from_json).pools[hostname].vdevs.values()
    | map(attribute='trim_notsup', default='0') | select('eq', '1')
    | list | length == 0
  ansible.builtin.systemd_service:
    state: started
    enabled: true
    name: "zfs-trim-weekly@{{ hostname }}.timer"
- name: Sanoid timer enabled
  ansible.builtin.systemd_service:
    state: started
    enabled: true
    name: sanoid.timer
- name: SELinux-compatible attributes on dataset
  become: true
  community.general.zfs:
    name: "{{ hostname }}"
    state: present
    extra_zfs_properties:
      xattr: sa
      acltype: posix
- name: Syncoid on backup system
  when: is_backup_sink
  ansible.builtin.import_tasks: syncoid.yml
- name: Source datasets mounted
  when: not is_backup_sink
  ansible.builtin.import_tasks: mounts.yml
- name: SELinux contexts for pool mounts
  when: not is_backup_sink
  ansible.builtin.import_tasks: selinux.yml
