---
# Punycode for pöpperl.eu: the router's busybox nslookup can't resolve the UTF-8 form.
router_ddns_domain: xn--ppperl-wxa.eu

# The homeserver's stable EUI-64 interface identifier (lower 64 bits of its
# LAN GUA), independent of whatever prefix the ISP currently delegates.
# Read live from the homeserver with: ip -6 addr show scope global
homeserver_passthrough_ipv6_iid: "56bf:64ff:fe72:627b"

# Vaultwarden is the source of truth for router secrets (via rbw, unlocked by
# the justfile). Keeping the WireGuard key there lets a replacement router
# take over without re-enrolling peers.
wireguard_private_key: "{{ lookup('ansible.builtin.pipe', 'rbw get \"WireGuard Endpoint\"') }}"
router_ddns_password: "{{ lookup('ansible.builtin.pipe', 'rbw get DYNDNS') }}"
https_dns_proxy_device_id: "{{ lookup('ansible.builtin.pipe', 'rbw get \"AdGuard DNS Home\" --field username') }}"

# Every "Wireguard Client" entry is a peer, so devices are added and removed in
# Vaultwarden, not here.
wireguard_peers: "{{ lookup('ansible.builtin.pipe', 'python3 ' ~ inventory_dir ~ '/.github/scripts/wireguard-peers.py') | from_json }}"
