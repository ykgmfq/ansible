---
- name: Common server functionality present
  hosts: server
  remote_user: root
  become: false
  roles:
    - hostname
    - ssh_keys
    - fcos_base
    - zfspool
    - lid_switch
- name: Service providers
  hosts: appserver
  remote_user: root
  become: false
  roles:
    - dyndns
    - container
    - home
    - systempub
- name: Offsite reachability
  hosts: backup
  remote_user: root
  become: false
  roles:
    - { role: wireguard_client, tags: [secrets] }
    - systempub
