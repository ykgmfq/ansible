---
name: Auto-merge Dependabot PRs
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-slim
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: meta
      - name: Enable auto-merge
        # ansible-core majors stay manual
        if: ${{ !(contains(steps.meta.outputs.dependency-names, 'ansible-core') && steps.meta.outputs.update-type == 'version-update:semver-major') }}
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
