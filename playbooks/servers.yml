---
- name: Common server functionality present
  hosts: server
  serial: 1
  remote_user: root
  become: false
  roles:
    - common
    - zfspool
    - lid_switch
- name: Service providers
  hosts: appserver
  serial: 1
  remote_user: root
  become: false
  roles:
    - dyndns
    - container
    - home
