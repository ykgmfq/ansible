---
- name: Unit files present
  notify: "system config changed"
  ansible.builtin.copy:
    src: units/
    dest: /etc/systemd/system
    mode: "ugo=r"
- name: Prod is default target
  notify: "system config changed"
  ansible.builtin.file:
    src: /etc/systemd/system/prod.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true # src does not exist yet in check mode on a fresh host
- name: Upgrade timer active
  ansible.builtin.systemd_service:
    name: podman-auto-update.timer
    enabled: true
    state: started
- name: Image prune timer active
  ansible.builtin.systemd_service:
    name: image-prune.timer
    enabled: true
    state: started
- name: Quadlet generator dryrun
  ansible.builtin.command: /usr/lib/systemd/system-generators/podman-system-generator -dryrun
  register: container_generator_result
  changed_when: false
  failed_when: false
- name: Quadlet files valid
  ansible.builtin.assert:
    that:
      - container_generator_result.rc == 0
    fail_msg: "{{ container_generator_result.stdout }}\n{{ container_generator_result.stderr }}"
