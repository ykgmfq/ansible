---
- name: Common server functionality present
  hosts: server
  serial: 1
  remote_user: root
  become: false
  roles:
    - hostname
    - fcos_base
    - zfspool
    - lid_switch
- name: Service providers
  hosts: appserver
  serial: 1
  remote_user: root
  become: false
  roles:
    - dyndns
    - container
    - home
    - systempub
- name: Offsite reachability
  hosts: backup
  serial: 1
  remote_user: root
  become: false
  roles:
    - wireguard_client
    - systempub
