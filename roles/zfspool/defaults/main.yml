---
zfspool_syncoid_user: syncoid
zfspool_syncoid_shell: /bin/sh
zfspool_syncoid_home: /var/home/syncoid

# Gets the default SELinux label, so no custom context is needed.
zfspool_sink_mountpoint: /var/srv/backup

# Shared by the sanoid retention template and the per-dataset syncoid timers.
zfspool_datasets:
  - name: persist
    hourly: 36
    daily: 30
    monthly: 6
    recursive: true
  - name: media
    hourly: 6
    daily: 3
    monthly: 1

# Set here rather than kept on the pool, so a rebuilt pool needs only `zpool create`.
# ephemeral nests under persist; its SELinux context is covered by persist's.
zfspool_source_mounts:
  persist: /srv/containers
  ephemeral: /srv/containers/ephemeral
  media: /mnt/media

zfspool_selinux_paths:
  - /srv/containers
  - /mnt/media

zfspool_permissions_source: send,hold
zfspool_permissions_sink: compression,mountpoint,create,mount,receive,rollback,recordsize,destroy
