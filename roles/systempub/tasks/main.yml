---
- name: Systempub config present
  notify: "systempub config changed"
  ansible.builtin.template:
    src: systempub.yaml.j2
    dest: /etc/systempub.yaml
    owner: root
    mode: "ugo=r"
# Without a broker URL systempub talks to the broker on the host itself, unauthenticated.
- name: Remote broker credential present
  when: systempub_mqtt_host | length > 0
  ansible.builtin.include_tasks: credential.yml
- name: Systempub active
  ansible.builtin.systemd_service:
    name: systempub.service
    enabled: true
    state: started
