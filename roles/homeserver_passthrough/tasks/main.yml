---
# Bare rules are only valid inside a chain; fw4 auto-includes /etc/nftables.d/*.nft at table level, where a bare rule is a syntax error that stops the whole firewall from loading.
# Matched on the address suffix, not `ether daddr`, which is unreliable in the forward hook (the Ethernet header isn't final yet).
# UCI rules can't express a masked match.
# Lives in /etc because /var is tmpfs on OpenWRT.
- name: Homeserver passthrough nftables snippet present
  notify: "homeserver passthrough changed"
  community.openwrt.template:
    src: homeserver-passthrough.nft
    dest: /etc/homeserver-passthrough.nft
    mode: "u=rw,go=r"

- name: Passthrough snippet included in firewall
  notify: "homeserver passthrough changed"
  community.openwrt.uci:
    command: section
    config: firewall
    type: include
    find:
      path: /etc/homeserver-passthrough.nft
    value:
      path: /etc/homeserver-passthrough.nft
      type: nftables
      position: chain-pre
      chain: forward_wan
