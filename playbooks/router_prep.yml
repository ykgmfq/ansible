---
# For a new/replacement router still at OpenWRT's factory-default address.
- name: Router prep
  hosts: router
  serial: 1
  remote_user: root
  become: false
  gather_facts: false
  roles:
    - { role: router_login, tags: [secrets] }
    - hostname
    - router_wan
    - router_firewall
    - { role: wireguard, tags: [secrets] }
    - homeserver_passthrough
    - { role: https_dns_proxy, tags: [secrets] }
