headless:
  vars:
    ansible_user: root
  children:
    homeserver:
      hosts:
        dm-poepperl.de:
      vars:
        is_backup_sink: false
        dataset: data
        syncoid_home: /var/mnt/persist/syncoid-home-source
    backup:
      hosts:
        # backup-dmp-main:
      vars:
        is_backup_sink: true
        dataset: backup
        syncoid_home: /var/mnt/backup/syncoid-home-sink
    router:
      hosts:
        openwrt-router:
          # ansible_host: 192.168.1.1 #factory default
          ansible_host: 192.168.178.1
