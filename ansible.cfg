[defaults]
# roles/ sits next to playbooks/, not inside it
roles_path = ./roles
# Same place ansible-lint installs to, so there is one copy of the collections
collections_path = ./.ansible/collections
stdout_callback = ansible.builtin.default
result_format = yaml
bin_ansible_callbacks = true
display_skipped_hosts = no
interpreter_python = auto_silent
pipelining = true
