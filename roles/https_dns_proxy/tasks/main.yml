---
- name: Resolver URL provided
  ansible.builtin.assert:
    that: https_dns_proxy_resolver_url | length > 0
    fail_msg: https_dns_proxy_resolver_url must be set in the personal inventory
    quiet: true
- name: HTTPS DNS proxy configured
  ansible.builtin.import_tasks: proxy.yml
- name: Dnsmasq wired to the proxy only
  ansible.builtin.import_tasks: dnsmasq.yml
