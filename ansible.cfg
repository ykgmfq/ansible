[defaults]
# roles/ sits next to playbooks/, not inside it, so it isn't found via the
# default playbook-dir-relative lookup
roles_path = ./roles
# Use the default callback plugin with YAML output
stdout_callback = ansible.builtin.default
result_format = yaml
# Use the stdout_callback when running ad-hoc commands
bin_ansible_callbacks = true
display_skipped_hosts = no
interpreter_python = auto_silent
pipelining = true
