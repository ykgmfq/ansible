---
# Enrolled on the broker before the host stores it, so a failed run retries cleanly.
- name: MQTT password generated
  no_log: true
  ansible.builtin.set_fact:
    systempub_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
# The host has no mosquitto_passwd, so the broker's image hashes the password.
- name: Password hashed
  delegate_to: "{{ groups['appserver'][0] }}"
  no_log: true
  environment:
    MQTT_USER: "{{ hostname }}"
    MQTT_PASSWORD: "{{ systempub_password }}"
  ansible.builtin.command:
    cmd: >-
      podman run --rm --entrypoint sh -e MQTT_USER -e MQTT_PASSWORD localhost/mosquitto
      -c 'mosquitto_passwd -b -c /tmp/p "$MQTT_USER" "$MQTT_PASSWORD" >/dev/null 2>&1 && cat /tmp/p'
  changed_when: false
  register: systempub_hash
- name: Password hash present on the broker
  delegate_to: "{{ groups['appserver'][0] }}"
  no_log: true
  notify: "broker passwords changed"
  ansible.builtin.lineinfile:
    path: "{{ systempub_broker_passwords_file }}"
    regexp: "^{{ hostname | regex_escape }}:"
    line: "{{ systempub_hash.stdout }}"
    mode: "u=rw,go="
- name: Broker restarted with new passwords
  ansible.builtin.meta: flush_handlers
- name: Password stored as encrypted credential
  no_log: true
  ansible.builtin.command:
    cmd: systemd-creds encrypt --name=mqtt - {{ systempub_credential_path }}
    stdin: "{{ systempub_password }}"
    stdin_add_newline: false
    creates: "{{ systempub_credential_path }}"
