---
# For a new/replacement router still at OpenWRT's factory-default address.
- name: Router prep
  hosts: router
  serial: 1
  remote_user: root
  become: false
  gather_facts: false
  roles:
    - router_login
    - router_wan
    - router_firewall
    - wireguard
    - homeserver_passthrough
    - https_dns_proxy
