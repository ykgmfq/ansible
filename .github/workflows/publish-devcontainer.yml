---
name: Publish DevContainer
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".devcontainer/**", ".github/workflows/publish-devcontainer.yml"]
  pull_request:
    paths: [".devcontainer/**", ".github/workflows/publish-devcontainer.yml"]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  publish:
    outputs:
      meta: ${{ steps.meta.outputs.json }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read ansible-core version
        id: core
        run: sed -n 's/^ansible-core==/core=/p' .devcontainer/requirements.txt >> "$GITHUB_OUTPUT"
      # GHCR reads the package description from the index annotations, not the image labels
      - name: Compute tags and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.core.outputs.core }}
            type=raw,value={{date 'YYYY-MM'}}
            type=sha,prefix=sha-
          annotations: |
            org.opencontainers.image.version=${{ steps.core.outputs.core }}
      - name: List tag names
        id: tags
        run: echo "tags=$(jq -r '.tags | map(sub(".*:"; "")) | join(",")' <<<"$META")" >> "$GITHUB_OUTPUT"
        env:
          META: ${{ steps.meta.outputs.json }}
      - name: Create dev network
        run: docker network inspect dev6 >/dev/null 2>&1 || docker network create dev6
      - name: Build, test and push
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/local/devcontainer.json
          imageName: ${{ env.IMAGE }}
          imageTag: ${{ steps.tags.outputs.tags }}
          cacheFrom: ${{ env.IMAGE }}:latest
          # Scheduled/manual runs rebuild from scratch to pick up base image and package updates
          noCache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          runCmd: ansible --version && ansible-lint --version && butane --version && just --version && rbw --version && molecule --version && qemu-system-x86_64 --version
          push: filter
          refFilterForPush: refs/heads/master
          eventFilterForPush: |
            push
            schedule
            workflow_dispatch
  # devcontainers/ci pushes in its post step, so anything needing the pushed image runs in a later job
  finalize:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag the pushed image with index annotations
        env:
          META: ${{ needs.publish.outputs.meta }}
        run: .github/scripts/publish-index.sh
      - name: Resolve digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | jq --raw-output .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        if: steps.digest.outputs.digest != ''
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
