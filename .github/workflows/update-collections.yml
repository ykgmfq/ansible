---
name: Update Galaxy collections
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
jobs:
  update-collections:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Pin latest collection versions
        run: ./.github/scripts/update-collections.sh
        id: update_collections
      - name: Create Pull Request
        if: steps.update_collections.outputs.result == 'updated'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: collections-autoupdate
          title: Update Galaxy collection pins
          commit-message: Update Galaxy collection pins
